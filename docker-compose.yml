services:

  # =========================================================
  # PostgreSQL - Patient Service
  # =========================================================
  patient-postgres:
    image: postgres:17
    container_name: patient-postgres

    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - patient-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patientdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================================================
  # PostgreSQL - Auth Service
  # =========================================================
  auth-service-db:
    image: postgres:17
    container_name: auth-service-db

    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5001:5432"

    volumes:
      - auth-service-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================================================
  # Kafka
  # =========================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw


  # =========================================================
  # Billing Service
  # =========================================================
  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile

    container_name: billing-service

    ports:
      - "4001:4001"

    expose:
      - "9001"

    depends_on:
      patient-postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker


  # =========================================================
  # Patient Service
  # =========================================================
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile

    container_name: patient-service-container

    ports:
      - "4000:4000"

    depends_on:
      patient-postgres:
        condition: service_healthy

      billing-service:
        condition: service_started

      kafka:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-postgres:5432/patientdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_SQL_INIT_MODE: always

      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092


  # =========================================================
  # Analytics Service
  # =========================================================
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile

    container_name: analytics-service-container

    ports:
      - "4042:4042"

    environment:
      SERVER_PORT: 4042
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092


  # =========================================================
  # API Gateway
  # =========================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    ports:
      - "4004:4004"

    depends_on:
      patient-service:
        condition: service_started

      billing-service:
        condition: service_started

      analytics-service:
        condition: service_started

    environment:
      SERVER_PORT: 4004
      AUTH_SERVICE_URL : http://auth-service:4005

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: auth-service-container



    depends_on:
      auth-service-db:
        condition: service_healthy

    environment:
      SERVER_PORT: 4005

      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: eQLe1SJBUSYigH4hNNVUkn1dQvO6gXkdCSTXNS1Gd15


# =========================================================
# Volumes
# =========================================================
volumes:
  patient-postgres-data:
  auth-service-db-data: